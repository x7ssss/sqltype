[package]
name = "sqltype"
version = "0.3.0"
edition = "2024"
authors = ["x7ssss <babadookmariqn@gmail.com>"]
repository = "https://github.com/x7ssss/sqltype"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
pg_query = "6.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "0.8"
colored = "2.1"
rayon = "1.10"
tempfile = "3.10"
walkdir = "2.5.0"
notify = "6.1"
lsp-server = "0.7"
lsp-types = "0.97"
arc-swap = "1.7"
crossbeam-channel = "0.5"
ctrlc = "3.4"
chrono = "0.4"
