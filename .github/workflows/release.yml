name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sqltype
            platform_pkg: linux-x64
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: sqltype
            platform_pkg: linux-arm64
            use_cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sqltype
            platform_pkg: darwin-x64
            use_cross: false

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sqltype
            platform_pkg: darwin-arm64
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sqltype.exe
            platform_pkg: win32-x64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Stage Artifact
        run: |
          mkdir -p dist/${{ matrix.platform_pkg }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.platform_pkg }}/
          else
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.platform_pkg }}/
            chmod +x dist/${{ matrix.platform_pkg }}/${{ matrix.artifact_name }}
          fi
        shell: bash

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform_pkg }}
          path: dist/${{ matrix.platform_pkg }}/${{ matrix.artifact_name }}

  publish-npm:
    name: Publish to NPM
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          registry-url: "https://registry.npmjs.org"

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Package and Publish Platform Packages
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          PLATFORMS=("linux-x64" "linux-arm64" "darwin-x64" "darwin-arm64" "win32-x64")

          for PLATFORM in "${PLATFORMS[@]}"; do
            echo "Preparing package for @sqltype/$PLATFORM..."
            PKG_DIR="npm/platforms/$PLATFORM"

            # Copy binary into platform package directory
            if [ "$PLATFORM" = "win32-x64" ]; then
              cp artifacts/binary-$PLATFORM/sqltype.exe "$PKG_DIR/sqltype.exe"
            else
              cp artifacts/binary-$PLATFORM/sqltype "$PKG_DIR/sqltype"
              chmod +x "$PKG_DIR/sqltype"
            fi

            # Update package.json version
            npm version "$VERSION" --prefix "$PKG_DIR" --no-git-tag-version

            # Publish platform package
            npm publish "$PKG_DIR" --access public
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash

      - name: Package and Publish Root sqltype Package
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          PKG_DIR="npm/sqltype"

          # Update root package.json version
          npm version "$VERSION" --prefix "$PKG_DIR" --no-git-tag-version

          # Update optionalDependencies versions to match release version
          node -e "
            const pkgPath = '$PKG_DIR/package.json';
            const pkg = require('./' + pkgPath);
            for (const key of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[key] = '$VERSION';
            }
            require('fs').writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "

          # Publish root package
          npm publish "$PKG_DIR" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
