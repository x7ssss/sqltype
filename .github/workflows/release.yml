name: Release

on:
  push:
    tags:
      - "v*"

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: sqltype
            platform_pkg: linux-x64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: sqltype
            platform_pkg: linux-arm64

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: sqltype
            platform_pkg: darwin-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: sqltype
            platform_pkg: darwin-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: sqltype.exe
            platform_pkg: win32-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install aarch64 cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        shell: bash

      - name: Stage Artifact
        run: |
          mkdir -p dist/${{ matrix.platform_pkg }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.platform_pkg }}/
          else
            cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} dist/${{ matrix.platform_pkg }}/
            chmod +x dist/${{ matrix.platform_pkg }}/${{ matrix.artifact_name }}
          fi
        shell: bash

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform_pkg }}
          path: dist/${{ matrix.platform_pkg }}/${{ matrix.artifact_name }}

  publish-and-release:
    name: Publish NPM Packages & GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Package and Publish Platform Packages
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          PLATFORMS=("linux-x64" "linux-arm64" "darwin-x64" "darwin-arm64" "win32-x64")

          for PLATFORM in "${PLATFORMS[@]}"; do
            echo "Preparing package for @x7ssss/sqltype-$PLATFORM..."
            PKG_DIR="npm/platforms/$PLATFORM"
            mkdir -p "$PKG_DIR/bin"

            # Copy binary into platform package bin directory
            if [ "$PLATFORM" = "win32-x64" ]; then
              cp artifacts/binary-$PLATFORM/sqltype.exe "$PKG_DIR/bin/sqltype.exe"
            else
              cp artifacts/binary-$PLATFORM/sqltype "$PKG_DIR/bin/sqltype"
              chmod +x "$PKG_DIR/bin/sqltype"
            fi

            # Update package.json version
            npm version "$VERSION" --prefix "$PKG_DIR" --no-git-tag-version --allow-same-version

            # Publish platform package
            npm publish "$PKG_DIR" --access public || echo "Package @x7ssss/sqltype-$PLATFORM may already be published"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash

      - name: Package and Publish Root sqltype Package
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          PKG_DIR="npm/sqltype"

          # Update root package.json version
          npm version "$VERSION" --prefix "$PKG_DIR" --no-git-tag-version --allow-same-version

          # Update optionalDependencies versions to match release version
          node -e "
            const pkgPath = '$PKG_DIR/package.json';
            const pkg = require('./' + pkgPath);
            for (const key of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[key] = '$VERSION';
            }
            require('fs').writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "

          # Publish root package
          cd "$PKG_DIR"
          npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash

      - name: Prepare Zipped Binaries for GitHub Release
        run: |
          TAG="${{ steps.get_version.outputs.TAG }}"
          mkdir -p release-assets

          tar -czvf "release-assets/sqltype-${TAG}-x86_64-unknown-linux-gnu.tar.gz" -C artifacts/binary-linux-x64 sqltype
          tar -czvf "release-assets/sqltype-${TAG}-aarch64-unknown-linux-gnu.tar.gz" -C artifacts/binary-linux-arm64 sqltype
          tar -czvf "release-assets/sqltype-${TAG}-x86_64-apple-darwin.tar.gz" -C artifacts/binary-darwin-x64 sqltype
          tar -czvf "release-assets/sqltype-${TAG}-aarch64-apple-darwin.tar.gz" -C artifacts/binary-darwin-arm64 sqltype
          zip -j "release-assets/sqltype-${TAG}-x86_64-pc-windows-msvc.zip" artifacts/binary-win32-x64/sqltype.exe
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
