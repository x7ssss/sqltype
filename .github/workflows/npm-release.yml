name: NPM Release

on:
  push:
    tags:
      - "v*"

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  build-binaries:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: sqltype.exe
            platform: win32-x64

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: sqltype
            platform: linux-x64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: sqltype
            platform: linux-arm64

          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: sqltype
            platform: darwin-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: sqltype
            platform: darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install aarch64 cross-compilation toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        shell: bash

      - name: Stage Artifact
        run: |
          mkdir -p dist/${{ matrix.platform }}
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/${{ matrix.platform }}/
          else
            cp target/${{ matrix.target }}/release/${{ matrix.bin_name }} dist/${{ matrix.platform }}/
            chmod +x dist/${{ matrix.platform }}/${{ matrix.bin_name }}
          fi
        shell: bash

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/${{ matrix.bin_name }}

  publish-npm:
    name: Bundle Binaries and Publish to NPM
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Bundle Platform Binaries into bin/
        run: |
          mkdir -p bin/win32-x64 bin/linux-x64 bin/linux-arm64 bin/darwin-x64 bin/darwin-arm64
          cp artifacts/binary-win32-x64/sqltype.exe bin/win32-x64/sqltype.exe
          cp artifacts/binary-linux-x64/sqltype bin/linux-x64/sqltype
          chmod +x bin/linux-x64/sqltype
          cp artifacts/binary-linux-arm64/sqltype bin/linux-arm64/sqltype
          chmod +x bin/linux-arm64/sqltype
          cp artifacts/binary-darwin-x64/sqltype bin/darwin-x64/sqltype
          chmod +x bin/darwin-x64/sqltype
          cp artifacts/binary-darwin-arm64/sqltype bin/darwin-arm64/sqltype
          chmod +x bin/darwin-arm64/sqltype
        shell: bash

      - name: Update Package Version
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
        shell: bash

      - name: Publish to NPM
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
